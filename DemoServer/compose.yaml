services:
  todo-server:
    build: .
    ports:
      - "8000:8000"
      - "8080:8000"
    environment:
      DB_HOST: mysql
      DB_NAME: todo_demo
      DB_USER: todo_user
      DB_PASSWORD: todo_demo_password
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: todo_demo_root_password
      MYSQL_DATABASE: todo_demo
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: todo_demo_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1 FROM todos LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
